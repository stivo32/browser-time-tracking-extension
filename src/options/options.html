<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Time Tracking - Settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div id="root">
        <div class="options-container">
            <header class="options-header">
                <h1>Browser Time Tracking Settings</h1>
                <p>Configure your time tracking preferences</p>
            </header>
            
            <main class="options-main">
                <section class="settings-section">
                    <h2>Tracking Settings</h2>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="tracking-enabled" checked>
                            Enable time tracking
                        </label>
                    </div>
                </section>
                
                <section class="settings-section">
                    <h2>Cloud Sync</h2>
                    <div class="setting-item">
                        <label>
                            API URL:
                            <input type="text" id="api-url" placeholder="http://localhost:8000" style="width: 100%; padding: 8px; margin-top: 5px;">
                        </label>
                        <small>Backend API address for cloud sync</small>
                    </div>
                    <div class="setting-item">
                        <div id="auth-status" style="margin-bottom: 15px;">
                            <p id="auth-status-text">Not connected</p>
                        </div>
                        <button id="auth-button" class="btn btn-primary">Sign In / Register</button>
                        <button id="sync-button" class="btn btn-secondary" style="display: none;">Sync Now</button>
                        <button id="logout-button" class="btn btn-danger" style="display: none;">Sign Out</button>
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="auto-sync">
                            Auto-sync data
                        </label>
                    </div>
                </section>
                
                <section class="settings-section">
                    <h2>Data Management</h2>
                    <div class="setting-item">
                        <button id="export-data" class="btn btn-primary">Export Data</button>
                        <button id="clear-data" class="btn btn-danger">Clear All Data</button>
                    </div>
                </section>
                
                <section class="settings-section">
                    <h2>Statistics</h2>
                    <div id="stats-display">
                        <p>Loading statistics...</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <script type="module" src="options.js"></script>
</body>
</html>
